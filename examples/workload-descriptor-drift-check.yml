# Copy to .github/workflows/workload-descriptor-drift-check.yml to keep workload.yaml
# in sync with .choreo/component.yaml during the migration transition window.
# Fails the PR if the descriptors drift; fix by re-running the generate workflow.
name: OpenChoreo workload descriptor drift check

on:
  pull_request:
    paths:
      - '**/.choreo/component.yaml'
      - '**/workload.yaml'

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - uses: isuruRuhu/openchoreo-workload-descriptor-action@v1
        with:
          mode: check
